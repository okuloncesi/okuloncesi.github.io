<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRED 325 Midterm Prep</title>
<meta name="description" content="All-in-one study app for the PRED 325 midterm (Weeks 1–5).">
<style>
:root{
  --bg:#f7f4ee; --surface:#ffffff; --ink:#1f2a2e; --muted:#5d6b70; --line:#e3ddd2;
  --accent:#0f6b6b; --accent-soft:#e2f0ee; --warm:#c8553d; --warm-soft:#fbe9e4;
  --ok:#2e7d4f; --ok-soft:#e3f3e8; --bad:#b3372b; --bad-soft:#fbe5e2; --gold:#b7861b;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a1c; --surface:#1d2528; --ink:#e7ecec; --muted:#9aa9ad; --line:#2d393d;
  --accent:#4fb8b0; --accent-soft:#1d3634; --warm:#e8836c; --warm-soft:#3a2420;
  --ok:#5cc489; --ok-soft:#183325; --bad:#ef7a6d; --bad-soft:#3b1f1c; --gold:#e0b44d;
  --shadow:none; }}
:root[data-theme="dark"]{
  --bg:#141a1c; --surface:#1d2528; --ink:#e7ecec; --muted:#9aa9ad; --line:#2d393d;
  --accent:#4fb8b0; --accent-soft:#1d3634; --warm:#e8836c; --warm-soft:#3a2420;
  --ok:#5cc489; --ok-soft:#183325; --bad:#ef7a6d; --bad-soft:#3b1f1c; --gold:#e0b44d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:980px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-size:1.1rem;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.85rem}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:9px 12px;font-size:.92rem;cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:1.35rem;margin:.2em 0 .6em}
h3{font-size:1.05rem;margin:1.4em 0 .4em;color:var(--accent)}
h4{margin:.2em 0 .5em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.warm{background:var(--warm)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
table{width:100%;border-collapse:collapse;margin:.5em 0 1em;font-size:.93rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700}
.tip{background:var(--warm-soft);border-left:4px solid var(--warm);padding:8px 12px;border-radius:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{background:var(--accent-soft);border-radius:10px;padding:8px 14px;text-align:center;min-width:90px}
.stats b{display:block;font-size:1.5rem;color:var(--accent)} .stats span{font-size:.8rem;color:var(--muted)}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
details.week>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.week>summary::-webkit-details-marker{display:none}
details.week>summary .wk{background:var(--accent);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem}
details.week>summary .rd{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:auto}
details.week .body{padding:0 16px 14px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.box h4{color:var(--warm)} .box ul,.box ol{padding-left:1.2em;margin:.2em 0}
/* flashcards */
.flash{perspective:1200px;height:260px;cursor:pointer;margin-bottom:12px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;box-shadow:var(--shadow)}
.flash .front{font-size:1.35rem;font-weight:700}
.flash .back{transform:rotateY(180deg);font-size:1.02rem;background:var(--accent-soft)}
.flash .tag{position:absolute;top:10px;left:14px;font-size:.75rem;color:var(--muted);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:.97rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.expl{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.93rem}
.q{font-weight:650;margin-bottom:6px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:middle}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.model{background:var(--ok-soft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;margin-top:10px}
.model ul{padding-left:1.2em;margin:.3em 0}
.kp{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:.93rem;cursor:pointer}
.kp input{margin-top:4px;accent-color:var(--accent)}
.sit{background:var(--warm-soft);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-style:italic}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;color:var(--accent)}
.timer.low{color:var(--bad)}
.score{font-size:2.4rem;font-weight:800;color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--accent),#174e5c);color:#fff;border:0}
.hero h2{color:#fff;margin-top:0}
.hero .muted{color:#d6ecea}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.02rem;margin-bottom:2px}
.tile span{color:var(--muted);font-size:.84rem}
.kbd{font-size:.78rem;color:var(--muted)}
@media (max-width:560px){ .flash{height:300px} .flash .front{font-size:1.15rem} h2{font-size:1.2rem} }
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><h1>PRED 325 <span>Midterm Prep</span></h1>
    <button class="iconbtn" id="themeBtn" title="Toggle theme">◐ Theme</button></div>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
(function(){
const D = window.DATA;
const $ = s => document.querySelector(s);
const app = $('#app');
const store = {
  get(k,d){ try{ const v=localStorage.getItem('pred325:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('pred325:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const wkName = id => { const w=D.weeks.find(x=>x.id===id); return w? 'W'+id+' · '+w.short : ''; };

// theme
(function(){ const t=store.get('theme',null); if(t) document.documentElement.dataset.theme=t; })();
$('#themeBtn').onclick=()=>{ const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; store.set('theme',nx); };

const TABS = [
  ['home','Home'],['notes','Notes'],['cheat','Cheat sheet'],['cards','Flashcards'],
  ['quiz','MCQ drill'],['sa','Short answer'],['sc','Scenarios'],['mock','Mock exam']
];
let tab = (location.hash||'#home').slice(1); if(!TABS.find(t=>t[0]===tab)) tab='home';
function renderNav(){ $('#nav').innerHTML = TABS.map(([k,l])=>`<button data-k="${k}" class="${k===tab?'on':''}">${l}</button>`).join(''); }
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; go(b.dataset.k); });
function go(k){ if(mock.timer && k!=='mock'){ /* keep timer running in bg */ } tab=k; if(location.hash!=='#'+k) history.pushState(null,'','#'+k); renderNav(); render(); window.scrollTo(0,0); const on=$('#nav .on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); }

function weekChips(sel, onPick){
  const all = [['all','All weeks']].concat(D.weeks.map(w=>[w.id,'W'+w.id+' '+w.short]));
  const html = `<div class="chips">${all.map(([v,l])=>`<button class="chip ${String(sel)===String(v)?'on':''}" data-w="${v}">${l}</button>`).join('')}</div>`;
  setTimeout(()=>{ document.querySelectorAll('.chips .chip[data-w]').forEach(b=>b.onclick=()=>onPick(b.dataset.w==='all'?'all':+b.dataset.w)); });
  return html;
}

/* ---------- HOME ---------- */
function home(){
  const qs = store.get('quizStats',{}); const answered=Object.keys(qs).length; const correct=Object.values(qs).filter(v=>v).length;
  const known = store.get('known',{}); const kn = Object.values(known).filter(Boolean).length;
  const best = store.get('mockBest',null);
  app.innerHTML = `
  <div class="card hero"><h2>Midterm: Wed 18 Nov, class time · 60 min</h2>
  <div class="muted">10 multiple-choice · 4 short-answer · 2 classroom scenarios · 100 pts · Weeks 1–5</div>
  <p style="margin:.7em 0 0">Focus: <b>main concepts</b>, <b>interpreting children's ideas</b>, and <b>suggesting teacher questions or support</b>. Brief sentences or bullets are enough for written answers.</p></div>
  <div class="grid4">
    <button class="tile" data-go="cheat"><b>⚡ Cheat sheet</b><span>Last 10 minutes? Start here.</span></button>
    <button class="tile" data-go="notes"><b>📘 Notes</b><span>All 5 decks, condensed</span></button>
    <button class="tile" data-go="cards"><b>🃏 Flashcards</b><span>${kn}/${D.cards.length} marked known</span></button>
    <button class="tile" data-go="quiz"><b>✅ MCQ drill</b><span>${correct}/${answered} correct of ${D.mcq.length}</span></button>
    <button class="tile" data-go="sa"><b>✍️ Short answer</b><span>${D.sa.length} prompts + model answers</span></button>
    <button class="tile" data-go="sc"><b>🧒 Scenarios</b><span>${D.sc.length} child-thinking cases</span></button>
    <button class="tile" data-go="mock"><b>⏱ Mock exam</b><span>${best!==null?'Best est. '+best+'/100':'Same format, timed'}</span></button>
  </div>
  <div class="card" style="margin-top:14px"><h4>Suggested 60-minute plan</h4>
  <ol class="small" style="margin:0;padding-left:1.2em">
  <li>Cheat sheet (5 min): memorise the lists and the scenario formula.</li>
  <li>MCQ drill on your weakest week (15 min).</li>
  <li>Scenarios (15 min): answer out loud or in bullets, then compare.</li>
  <li>Mock exam (20 min, or a full 60).</li>
  <li>Review wrong answers (5 min).</li></ol></div>
  <div class="card small muted">What's covered: ${D.weeks.map(w=>`<b>W${w.id}</b> ${esc(w.title)} <i>(${esc(w.reading)})</i>`).join(' · ')}.<br>Built from the course slides. Progress is saved on this device.
  <div class="row" style="margin-top:8px"><button class="btn ghost" id="reset" style="padding:6px 12px;font-size:.85rem">Reset my progress</button></div></div>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $('#reset').onclick=()=>{ if(confirm('Reset all saved progress?')){ ['quizStats','known','mockBest','sa','sc','drafts'].forEach(k=>store.set(k, k==='mockBest'?null:{})); home(); } };
}

/* ---------- NOTES ---------- */
function notes(){
  app.innerHTML = `<h2>Lecture notes</h2><p class="muted small">Tap a week to expand. Each one is condensed from its deck.</p>` +
    D.weeks.map(w=>`<details class="week" ${w.id===1?'open':''}><summary><span class="wk">W${w.id}</span>${esc(w.title)}<span class="rd">${esc(w.reading)}</span></summary><div class="body">${D.notes[w.id]}</div></details>`).join('');
}
function cheat(){ app.innerHTML = `<h2>Cheat sheet</h2><p class="muted small">Everything that answers a scenario question, on one page.</p>` + D.cheat; }

/* ---------- FLASHCARDS ---------- */
let fc = { week:'all', onlyUnknown:false, order:null, i:0, flip:false };
function cards(){
  const known = store.get('known',{});
  let pool = D.cards.map((c,idx)=>({c,idx})).filter(x=>fc.week==='all'||x.c[0]===fc.week);
  if(fc.onlyUnknown) pool = pool.filter(x=>!known[x.idx]);
  if(!fc.order || fc.order.length!==pool.length || fc.order.some(i=>!pool.find(p=>p.idx===i))) { fc.order = pool.map(p=>p.idx); fc.i=0; }
  const n = fc.order.length;
  if(fc.i>=n) fc.i=0;
  const cur = n? D.cards[fc.order[fc.i]] : null; const curIdx = n? fc.order[fc.i]:null;
  const kCount = pool.filter(p=>known[p.idx]).length;
  app.innerHTML = `<h2>Flashcards</h2>` + weekChips(fc.week, w=>{fc.week=w; fc.order=null; fc.flip=false; cards();}) +
   `<div class="row small"><label class="kp" style="margin:0"><input type="checkbox" id="ou" ${fc.onlyUnknown?'checked':''}> Only cards I don't know yet</label><span class="spacer"></span><button class="btn ghost" id="shuf" style="padding:6px 12px">Shuffle</button></div>
   <div class="progress"><i style="width:${n? (fc.i+1)/n*100:0}%"></i></div>` +
   (cur? `<div class="flash ${fc.flip?'flip':''}" id="fl"><div class="inner">
      <div class="face front"><span class="tag">${wkName(cur[0])} · ${fc.i+1}/${n}</span>${esc(cur[1])}<div class="kbd" style="margin-top:14px;font-weight:400">tap to flip</div></div>
      <div class="face back"><span class="tag">${esc(cur[1])}</span>${esc(cur[2])}</div></div></div>
    <div class="row"><button class="btn ghost" id="prev">← Prev</button><span class="spacer"></span>
    <button class="btn warm" id="again">Still learning</button><button class="btn" id="got">I know it ✓</button></div>
    <p class="small muted">${kCount}/${pool.length} known in this set${known[curIdx]?' · this card is marked known':''}. Keys: space = flip, ← →, K = known.</p>`
   : `<div class="card">All cards in this set are marked known 🎉 <button class="btn ghost" id="clr">Unmark all</button></div>`);
  $('#ou').onchange=e=>{fc.onlyUnknown=e.target.checked; fc.order=null; cards();};
  $('#shuf').onclick=()=>{ fc.order=shuffle(pool.map(p=>p.idx)); fc.i=0; fc.flip=false; cards(); };
  if(cur){
    $('#fl').onclick=()=>{fc.flip=!fc.flip; $('#fl').classList.toggle('flip');};
    $('#prev').onclick=()=>{ fc.i=(fc.i-1+n)%n; fc.flip=false; cards(); };
    $('#again').onclick=()=>{ known[curIdx]=false; store.set('known',known); fc.i=(fc.i+1)%n; fc.flip=false; cards(); };
    $('#got').onclick=()=>{ known[curIdx]=true; store.set('known',known); if(fc.onlyUnknown){ fc.order.splice(fc.i,1); } else fc.i=(fc.i+1)%n; fc.flip=false; cards(); };
  } else { const c=$('#clr'); if(c) c.onclick=()=>{ pool.forEach(p=>known[p.idx]=false); store.set('known',known); fc.order=null; cards(); }; }
}

/* ---------- MCQ DRILL ---------- */
let qz = { week:'all', mode:'all', order:null, i:0, picked:null, session:{r:0,t:0} };
function quiz(){
  const stats = store.get('quizStats',{});
  let pool = D.mcq.map((m,idx)=>idx).filter(i=>qz.week==='all'||D.mcq[i][0]===qz.week);
  if(qz.mode==='wrong') pool = pool.filter(i=>stats[i]===false);
  if(qz.mode==='new') pool = pool.filter(i=>stats[i]===undefined);
  if(!qz.order){ qz.order = shuffle(pool); qz.i=0; qz.picked=null; }
  const n=qz.order.length;
  const head = `<h2>MCQ drill</h2>` + weekChips(qz.week, w=>{qz.week=w; qz.order=null; quiz();}) +
   `<div class="chips">${[['all','All'],['new','Not tried'],['wrong','My mistakes']].map(([k,l])=>`<button class="chip ${qz.mode===k?'on':''}" data-m="${k}">${l}</button>`).join('')}<span class="small muted" style="align-self:center;margin-left:6px">This session: ${qz.session.r}/${qz.session.t}</span></div>`;
  if(!n || qz.i>=n){
    app.innerHTML = head + `<div class="card">${n? `Set finished, ${qz.session.r}/${qz.session.t} correct this session.` : (qz.mode==='wrong'?'No mistakes recorded here. 🎉':'Nothing left in this filter.')}<div class="row" style="margin-top:10px"><button class="btn" id="again">Restart set</button></div></div>`;
    bindModes(); $('#again').onclick=()=>{qz.order=null; quiz();}; return;
  }
  const idx=qz.order[qz.i], m=D.mcq[idx];
  const optOrder = qz.optOrder && qz.optOrder.idx===idx ? qz.optOrder.o : (qz.optOrder={idx,o:shuffle(m[2].map((_,k)=>k))}).o;
  app.innerHTML = head + `<div class="progress"><i style="width:${(qz.i)/n*100}%"></i></div>
   <div class="card"><div class="q"><span class="badge">${wkName(m[0])}</span>${qz.i+1}/${n}. ${esc(m[1])}</div>
   ${optOrder.map((k,j)=>{ let cls=''; if(qz.picked!==null){ if(k===m[3]) cls='right'; else if(k===qz.picked) cls='wrong'; }
     return `<button class="opt ${cls}" data-k="${k}" ${qz.picked!==null?'disabled':''}>${'ABCD'[j]}. ${esc(m[2][k])}</button>`;}).join('')}
   ${qz.picked!==null? `<div class="expl"><b>${qz.picked===m[3]?'Correct.':'Not quite.'}</b> ${esc(m[4])}</div><div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" id="next">Next →</button></div>`:''}
   </div>`;
  bindModes();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; qz.picked=k; const ok=k===m[3]; stats[idx]=ok; store.set('quizStats',stats); qz.session.t++; if(ok) qz.session.r++; quiz(); });
  const nx=$('#next'); if(nx){ nx.onclick=()=>{ qz.i++; qz.picked=null; quiz(); }; nx.focus(); }
  function bindModes(){ app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{qz.mode=b.dataset.m; qz.order=null; quiz();}); }
}

/* ---------- SHORT ANSWER & SCENARIOS (practice) ---------- */
let saState = { week:'all' }, scState={ week:'all' };
function kpList(points, key, id){
  const saved = store.get(key,{})[id] || [];
  return `<div style="margin-top:8px"><div class="small muted">Did your answer include…</div>${points.map((p,i)=>`<label class="kp"><input type="checkbox" data-kp="${id}" data-i="${i}" ${saved[i]?'checked':''}> ${esc(p)}</label>`).join('')}</div>`;
}
function bindKp(key){
  app.querySelectorAll('[data-kp]').forEach(cb=>cb.onchange=()=>{ const all=store.get(key,{}); const id=cb.dataset.kp; all[id]=all[id]||[]; all[id][+cb.dataset.i]=cb.checked; store.set(key,all); });
}
function sa(){
  const items = D.sa.map((s,i)=>({s,i})).filter(x=>saState.week==='all'||x.s[0]===saState.week);
  app.innerHTML = `<h2>Short-answer practice</h2><p class="muted small">Write brief bullets first, then reveal the model answer and tick the key points you hit.</p>` +
    weekChips(saState.week, w=>{saState.week=w; sa();}) +
    items.map(({s,i})=>`<div class="card"><div class="q"><span class="badge">${wkName(s[0])}</span>${esc(s[1])}</div>
      <textarea placeholder="Your answer (bullets are fine)…" data-ta="sa${i}"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-rev="${i}">Show model answer</button></div>
      <div id="sar${i}" hidden><div class="model">${s[2]}</div>${kpList(s[3],'sa',i)}</div></div>`).join('');
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ const el=$('#sar'+b.dataset.rev); el.hidden=!el.hidden; b.textContent=el.hidden?'Show model answer':'Hide model answer'; });
  bindKp('sa'); bindDrafts();
}
function sc(){
  const items = D.sc.map((s,i)=>({s,i})).filter(x=>scState.week==='all'||x.s[0]===scState.week);
  app.innerHTML = `<h2>Classroom scenarios</h2><p class="muted small">For each one: what is the child thinking, what would you say or do, and what evidence would you look for? Use <b>Notice → Interpret → Extend</b>.</p>` +
    weekChips(scState.week, w=>{scState.week=w; sc();}) +
    items.map(({s,i})=>`<div class="card"><div class="q"><span class="badge">${wkName(s[0])}</span>${esc(s[1])}</div>
      <div class="sit">${esc(s[2])}</div>
      ${s[5]? `<div class="small"><b>Quick check:</b> ${esc(s[5].q)}</div>${s[5].opts.map((o,k)=>`<button class="opt" data-sq="${i}" data-k="${k}">${'ABC'[k]}. ${esc(o)}</button>`).join('')}<div id="sqx${i}"></div>`:''}
      <textarea placeholder="Child's thinking / Teacher move / Evidence…" data-ta="sc${i}"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-rev="${i}">Show model answer</button></div>
      <div id="scr${i}" hidden><div class="model">${s[3]}</div>${kpList(s[4],'sc',i)}</div></div>`).join('');
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ const el=$('#scr'+b.dataset.rev); el.hidden=!el.hidden; b.textContent=el.hidden?'Show model answer':'Hide model answer'; });
  app.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sq, k=+b.dataset.k, q=D.sc[i][5];
    app.querySelectorAll(`[data-sq="${i}"]`).forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.ans) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
    $('#sqx'+i).innerHTML=`<div class="expl">${esc(q.why)}</div>`; });
  bindKp('sc'); bindDrafts();
}
function bindDrafts(){
  const drafts = store.get('drafts',{});
  app.querySelectorAll('[data-ta]').forEach(t=>{ t.value = drafts[t.dataset.ta]||''; t.oninput=()=>{ drafts[t.dataset.ta]=t.value; store.set('drafts',drafts); }; });
}

/* ---------- MOCK EXAM ---------- */
// Point weights are an assumption (the announcement gives only the total of 100).
const W = { mcq:3, sa:10, sc:15 };
let mock = { phase:'intro', set:null, ans:null, end:0, timer:null, kp:null };
function mockStart(){
  mock.set = {
    mcq: shuffle(D.mcq.map((_,i)=>i)).slice(0,10).map(i=>({i, o:shuffle([0,1,2,3].slice(0,D.mcq[i][2].length))})),
    sa: pickSpread(D.sa,4), sc: pickSpread(D.sc,2)
  };
  mock.ans = { mcq:{}, sa:{}, sc:{} }; mock.kp={sa:{},sc:{}};
  mock.end = Date.now() + 60*60*1000; mock.phase='run';
  clearInterval(mock.timer); mock.timer=setInterval(tick,1000); mockView();
}
function pickSpread(arr,n){ // prefer different weeks
  const byWeek={}; shuffle(arr.map((_,i)=>i)).forEach(i=>{(byWeek[arr[i][0]]=byWeek[arr[i][0]]||[]).push(i);});
  const weeks=shuffle(Object.keys(byWeek)); const out=[]; let r=0;
  while(out.length<n){ for(const w of weeks){ if(out.length<n && byWeek[w][r]!==undefined) out.push(byWeek[w][r]); } r++; if(r>20) break; }
  return out;
}
function tick(){
  const left = Math.max(0, mock.end-Date.now());
  const el=$('#tmr'); if(el){ const m=Math.floor(left/60000), s=Math.floor(left/1000)%60; el.textContent=`${m}:${String(s).padStart(2,'0')}`; el.classList.toggle('low', left<5*60000); }
  if(left<=0 && mock.phase==='run'){ mockSubmit(); }
}
function mockSubmit(){ clearInterval(mock.timer); mock.timer=null; mock.phase='review'; if(tab==='mock') mockView(); }
function mockScore(){
  let mc=0; mock.set.mcq.forEach((q,j)=>{ if(mock.ans.mcq[j]===D.mcq[q.i][3]) mc++; });
  const frac=(list,data,kind)=>list.reduce((a,id,j)=>{ const pts=data[id][kind==='sa'?3:4]; const got=(mock.kp[kind][j]||[]).filter(Boolean).length; return a + (pts.length? got/pts.length:0); },0);
  const saF=frac(mock.set.sa,D.sa,'sa'), scF=frac(mock.set.sc,D.sc,'sc');
  return { mc, total: Math.round(mc*W.mcq + saF*W.sa + scF*W.sc) };
}
function mockView(){
  if(mock.phase==='intro'){
    app.innerHTML = `<h2>Mock exam</h2><div class="card"><p>Same format as the real midterm: <b>10 multiple-choice, 4 short-answer, 2 classroom scenarios</b>, 60-minute timer, randomly drawn from all five weeks.</p>
    <p class="small muted">Scoring estimate: MCQs are auto-marked; for written answers you tick the key points you covered after seeing the model answer. Assumed weights: MCQ ${W.mcq} pts × 10, short answer ${W.sa} × 4, scenario ${W.sc} × 2. The real exam's split wasn't announced.</p>
    <button class="btn" id="go">Start (60:00)</button></div>`;
    $('#go').onclick=mockStart; return;
  }
  const S=mock.set, R=mock.phase==='review';
  let h = `<div class="card row" style="position:sticky;top:96px;z-index:5;padding:10px 14px"><b>Mock exam</b><span class="spacer"></span>${R?'<span class="badge">Review</span>':'<span class="timer" id="tmr">60:00</span>'}</div>`;
  if(R){ const sc=mockScore(); const best=store.get('mockBest',null); if(best===null||sc.total>best) store.set('mockBest',sc.total);
    h += `<div class="card"><div class="score">${sc.total}/100</div><div class="muted">MCQ ${sc.mc}/10 · written parts are scored from the key points you tick below (the total updates when you tick)</div><div class="row" style="margin-top:10px"><button class="btn" id="again">New mock exam</button></div></div>`; }
  h += `<h3>Part A: Multiple choice (10)</h3>` + S.mcq.map((q,j)=>{ const m=D.mcq[q.i]; const a=mock.ans.mcq[j];
    return `<div class="card"><div class="q">${j+1}. ${esc(m[1])}</div>${q.o.map((k,x)=>{ let cls=''; if(R){ if(k===m[3]) cls='right'; else if(k===a) cls='wrong'; } else if(k===a) cls='sel';
      return `<button class="opt ${cls}" data-mq="${j}" data-k="${k}" ${R?'disabled':''}>${'ABCD'[x]}. ${esc(m[2][k])}</button>`;}).join('')}${R?`<div class="expl">${esc(m[4])}</div>`:''}</div>`; }).join('');
  h += `<h3>Part B: Short answer (4)</h3>` + S.sa.map((id,j)=>{ const s=D.sa[id];
    return `<div class="card"><div class="q">${11+j}. ${esc(s[1])}</div><textarea data-ma="sa${j}" ${R?'readonly':''}>${esc(mock.ans.sa[j]||'')}</textarea>${R?`<div class="model">${s[2]}</div>${mkp('sa',j,s[3])}`:''}</div>`; }).join('');
  h += `<h3>Part C: Classroom scenarios (2)</h3>` + S.sc.map((id,j)=>{ const s=D.sc[id];
    return `<div class="card"><div class="q">${15+j}. ${esc(s[1])}</div><div class="sit">${esc(s[2])}</div><div class="small muted">What might the child be thinking? What would you say or do? What evidence would you look for?</div><textarea data-ma="sc${j}" ${R?'readonly':''}>${esc(mock.ans.sc[j]||'')}</textarea>${R?`<div class="model">${s[3]}</div>${mkp('sc',j,s[4])}`:''}</div>`; }).join('');
  if(!R) h += `<div class="row"><span class="spacer"></span><button class="btn warm" id="sub">Submit exam</button></div>`;
  app.innerHTML = h; tick();
  app.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{ const j=+b.dataset.mq; mock.ans.mcq[j]=+b.dataset.k; app.querySelectorAll(`[data-mq="${j}"]`).forEach(x=>x.classList.toggle('sel',x===b)); });
  app.querySelectorAll('[data-ma]').forEach(t=>t.oninput=()=>{ const k=t.dataset.ma; mock.ans[k.slice(0,2)][+k.slice(2)]=t.value; });
  app.querySelectorAll('[data-mk]').forEach(cb=>cb.onchange=()=>{ const [kind,j,i]=cb.dataset.mk.split(':'); (mock.kp[kind][j]=mock.kp[kind][j]||[])[+i]=cb.checked; const s=mockScore(); app.querySelector('.score').textContent=s.total+'/100'; const best=store.get('mockBest',null); if(best===null||s.total>best) store.set('mockBest',s.total); });
  const sb=$('#sub'); if(sb) sb.onclick=()=>{ const un=10-Object.keys(mock.ans.mcq).length; if(confirm(un?`${un} MCQ unanswered. Submit anyway?`:'Submit and see results?')) mockSubmit(); };
  const ag=$('#again'); if(ag) ag.onclick=()=>{ mock.phase='intro'; mockView(); };
}
function mkp(kind,j,pts){ const saved=mock.kp[kind][j]||[]; return `<div style="margin-top:8px"><div class="small muted">Tick what your answer covered:</div>${pts.map((p,i)=>`<label class="kp"><input type="checkbox" data-mk="${kind}:${j}:${i}" ${saved[i]?'checked':''}> ${esc(p)}</label>`).join('')}</div>`; }

/* ---------- router ---------- */
function render(){ ({home,notes,cheat,cards,quiz,sa,sc,mock:mockView})[tab](); }
document.addEventListener('keydown',e=>{
  if(tab!=='cards' || /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  if(e.key===' '){ e.preventDefault(); const f=$('#fl'); if(f) f.click(); }
  else if(e.key==='ArrowRight'){ if(fc.order&&fc.order.length){ fc.i=(fc.i+1)%fc.order.length; fc.flip=false; cards(); } }
  else if(e.key==='ArrowLeft'){ const b=$('#prev'); if(b) b.click(); }
  else if(e.key.toLowerCase()==='k'){ const b=$('#got'); if(b) b.click(); }
});
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(k!==tab && TABS.find(t=>t[0]===k)) go(k); });
renderNav(); render();
})();
</script>
