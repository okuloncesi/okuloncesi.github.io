S.push({title:"Two-generation programs + Türkiye", min:12, star:true, blocks:[
{t:"learn", h:"Tanım + core components", html:`
<p><span class="k">Two-generation approach</span> (Smith, “Two Generation Programs for Families in Poverty”): <mark>hem çocuğa hem ebeveyne aynı anda ve entegre</mark> hizmet veren programlar.</p>
<p>Mantık: çocuğun gelişimi ailenin kapasitesine bağlıdır. Ebeveyn güçlenince çocuk etkilenir, çocuğun ilerlemesi de ebeveyni motive eder (transactional).</p>
<h2>Core components</h2>
<ol>
<li><span class="k">Early childhood education</span>: çocuk için kaliteli okul öncesi</li>
<li><span class="k">Parenting education/support</span>: ebeveyn–çocuk etkileşimi, ebeveynlik becerileri</li>
<li><span class="k">Adult self-sufficiency</span>: okuryazarlık, eğitim, meslek ve iş</li>
<li><span class="k">Support services &amp; social capital</span>: sağlık, psikososyal destek, vaka koordinasyonu, akran ağı</li>
</ol>
<div class="note"><span class="k">Harvard Center, “Building Adult Capabilities”:</span> çocuk sonuçlarını iyileştirmek için yetişkinin <em>executive function ve öz-düzenlemesini</em> güçlendir, <em>stres kaynaklarını azalt</em>, <em>yanıt veren ilişkileri</em> destekle.</div>`},
{t:"learn", h:"Başarı koşulları + zorluklar", html:`
<ol>
<li><mark>Entegrasyon</mark>: iki kuşağın hizmetleri ortak hedef ve içerik paylaşır, yan yana ama kopuk yürümez</li>
<li><span class="k">Yoğunluk ve süre</span>: tek seferlik seminer değil, aylarca haftalık</li>
<li><span class="k">Kalite ve eğitimli personel</span></li>
<li><span class="k">Kültürel ve bağlamsal duyarlılık</span>: aile değerlerine saygı (Kağıtçıbaşı: autonomous-related), anadilde materyal</li>
<li><span class="k">Güçlü yanlara dayalı</span>, eksiklik vurgusuz bir duruş</li>
<li><span class="k">Recruitment &amp; retention</span>: esnek saatler, çocuk bakımı, akran desteği. <mark>Programı bırakma büyük bir sorun (Smith Ch.10)</mark></li>
<li><span class="k">Değerlendirme</span>: iki kuşağı da ölç (pre/post, gözlem, veli görüşü)</li>
</ol>
<p class="mini">Smith Ch.10, tasarım ve değerlendirme zorlukları: düşük yoksa çok yüksek yoğunluk, programdan ayrılmalar, hangi sonucun ölçüleceği, ölçme araçları, kontrol grubu sorunu.</p>`},
{t:"learn", h:"📖 Okuma: Ramey et al. Ch.7 “Two-Generation Early Intervention Programs” (Q3'ün ana kaynağı)", html:`
<p><span class="k">Tanım ve amaç:</span> “to simultaneously help prepare parents for employment that can improve families' economic resources and to enhance the development of children through a variety of direct and indirect supports.” Hedef, yüksek riskli yoksul ortamlardaki çocukların gelişimi. Program “simultaneously” çocuk ve ebeveynin ihtiyaçlarına yanıt verir.</p>
<p><span class="k">Tipik hizmetler:</span></p>
<ol>
<li>İstihdama hazırlık: yetişkin eğitimi, meslek eğitimi, iş yerleştirme.</li>
<li>Yaşam becerileri ve ebeveynlik eğitimi.</li>
<li>Kaliteli çocuk bakımı ve erken eğitim.</li>
<li>Sağlık, ulaşım ve sosyal hizmetlere erişim.</li>
</ol>
<p><span class="k">Neden iki kuşak?</span></p>
<ul>
<li>Eski çocuk programları yalnızca çocuğa hizmet veriyordu; yoksulluk programları ise yalnızca ebeveyne odaklanıp etkinin “trickle-down” ile çocuğa ulaşacağını varsayıyordu.</li>
<li>Oysa çok düşük kaynaklı ailelerde ilk 5 yılda bu kadar büyük değişimin olabileceğine dair kanıt yok.</li>
<li>Yalnızca ebeveynin kendi ayakları üzerinde durmasına odaklanmak “is not likely to be an adequate strategy” for child development.</li>
<li>Vaat: “both generations are expected to experience benefits that will be sustained and may even increase over time.”</li>
</ul>
<p><span class="k">Etkili erken müdahalenin 7 ilkesi (Ramey &amp; Ramey) = başarı koşulları:</span></p>
<ol>
<li><b>Timing</b>: erken başlayıp uzun süren müdahale daha çok fayda sağlar (Abecedarian, IHDP). Müdahale olmazsa 2–3 yaşta ciddi kayıp olur ve tam telafinin kanıtı yok.</li>
<li><b>Intensity</b>: daha yoğun program daha büyük etki yaratır. <mark>IHDP'de en çok katılan üçte birlik grupta zihinsel gerilik yaklaşık 9 kat azaldı.</mark> Haftada 1 ev ziyareti yetmedi; 3 ziyarette fayda görüldü (Powell &amp; Grantham-McGregor).</li>
<li><b>Direct provision</b>: çocuğa doğrudan sunulan öğrenme deneyimi, aracılı olandan çok daha etkili. Project CARE'de sadece ev ziyareti işe yaramadı; tam gün merkez + ev ziyareti işe yaradı.</li>
<li><b>Breadth</b>: doğrudan ve dolaylı yolları birleştiren programlar en büyük etkiyi yaratır. Bazen önce yiyecek, konut ve gelir gibi temel ihtiyaçlar karşılanmalıdır.</li>
<li><b>Individual differences</b>: herkese aynı paket olmaz. “A single set of parenting education classes is unlikely to be adequate.”</li>
<li><b>Environmental maintenance</b>: destek sürmezse kazanım söner; ilkokula geçişte de destek gerekir.</li>
<li><b>Cultural appropriateness</b>: kültürel inanç ve pratiklerin üzerine kurulmalı; toplulukla ve katılımcılarla birlikte tasarlanmalı; stereotipten kaçınılmalı. Örnek: Avance eski katılımcıları istihdam ediyor.</li>
</ol>
<p><span class="k">Kaynaklar 3 hedefe yönelir:</span> aile birimi (gelir, konut, sağlık, ulaşım) · yetişkin (eğitim, iş, ebeveynlik) · çocuk (eğitim, bakım, sosyal-duygusal destek). Süreç: bireysel ihtiyaç analizi → vaka yönetimi → izleme ve uyarlama → yeniden değerlendirme.</p>
<p><span class="k">6 gelişimsel “priming” mekanizması</span> (hem çocuk hem yetişkin için):</p>
<ol>
<li>Keşfetme fırsatı.</li>
<li>Yeni becerilerde mentorluk.</li>
<li>Gelişimsel başarıları kutlamak.</li>
<li>Yeni becerileri tekrar etmek.</li>
<li>Uygunsuz ceza ve alaydan kaçınmak.</li>
<li>Dil desteği.</li>
</ol>`},
{t:"learn", h:"📖 Okuma: Powell Ch.10 (zorluklar) + Reynolds + Guralnick + eleştiri", html:`
<p><span class="k">Powell, “Challenges in the Design and Evaluation of Parent–Child Intervention Programs”:</span> “top-down, professionally driven”, herkese aynı programı uygulayan modelden uzaklaşma. 3 zorluk:</p>
<ol>
<li><b>Matching programs and parents</b>: velinin ihtiyaç algısıyla uyum (goodness of fit). Ulaşılması zor aileler: düşük gelirli ve sık taşınan aileler programı bırakıyor.</li>
<li><b>Realigning parent–professional relations</b>: “yüksek riskli” aileleri hedeflemekle eksiklik vurgusu yapmamak arasında temel bir uyumsuzluk var. Güçlendirme önemli, ama bazı gruplar (örneğin genç anneler) net yönlendirme istiyor.</li>
<li><b>Social context of parenthood</b>: dış stres azalınca ebeveyn yetkinliği artar. Ama çocuk kaybolmamalı: Child and Family Resource Program'da ev ziyaretleri aileye odaklanınca “family circumstances but not child functioning were improved.” Zorluk: “to balance the needs of child, parent, and family.”</li>
</ol>
<p><span class="k">Reynolds (1998), uzun vadeli etkinliğin 8 ilkesi:</span></p>
<ol>
<li>En yüksek riskli aileleri hedefle.</li>
<li>Erken başla, 2–3. sınıfa kadar sürdür.</li>
<li>Kapsamlı hizmet sun (sağlık, sosyal hizmet, veli programı, müfredat).</li>
<li><mark>Aktif ve çok yönlü veli katılımı, “the cornerstone”.</mark></li>
<li>Çocuk merkezli, yapılandırılmış müfredat.</li>
<li>Küçük sınıflar (1:8 veya daha düşük).</li>
<li>Personel gelişimi.</li>
<li>Değerlendirme (bütçenin en az %3'ü).</li>
</ol>
<p><span class="k">Chicago Child-Parent Centers:</span></p>
<ul>
<li>Veliler haftada en az yarım gün merkezde bulunmak zorunda; veli odası var; kayıtta ev ziyareti yapılıyor.</li>
<li>6 yıl katılanlar 8. sınıfta okumada 1 sınıf düzeyi önde (7.7'ye karşı 6.7).</li>
<li>Sınıf tekrarı: 6 yıl katılanlarda %11, 4 yıl katılanlarda %23.</li>
<li>Uzun vadeli etkinin iki yolu: (1) okula hazırlık, (2) veli katılımı. Katılan ebeveynler “are more likely to continue to provide the nurturance necessary to maintain gains.”</li>
</ul>
<p><span class="k">Guralnick, developmental systems model:</span> erken müdahalenin en kritik özelliği, müdahalenin “center on families”. Gelişimi yönlendiren 3 aile etkileşim örüntüsü:</p>
<ol>
<li>Ebeveyn-çocuk etkileşiminin kalitesi.</li>

const Q1MODEL = `
<p><b>Why.</b> Families are children's first and most important teachers. As Coletta (Ch.1) argues, "no influence upon the child's early years is as powerful as that of the home"; the Coleman Report (1966) identified home background as the chief factor in school success. Ecologically (Bronfenbrenner), the child lives in two microsystems, home and preschool, and the <b>mesosystem</b> between them shapes development (AÇEV), so engagement builds continuity. Coletta's strongest argument concerns <b>sustaining gains</b>: Head Start gains "were lost when parents terminated their school involvement", and Bronfenbrenner (1974) concluded that "without family involvement, any effects of intervention are likely to be ephemeral." The Head Start (MIDCO, 1972) survey found that "the amount of parent involvement was far more important than the model." Following Gordon's (1968) assumptions, children learn best when home and school share the educational experience, and parents' self-esteem rises when they can teach their own children. AÇEV adds that the best predictor of school success is not income but a learning-supportive home environment. Coletta lists five benefits: higher and sustained achievement and motivation, better self-concepts, support for school and home, public understanding, and parents' personal growth. Teachers benefit too: they know children better and share responsibility.</p>
<p><b>Barriers.</b> Parents say they do not take part because they have no time, do not know what to do, do not know it is important, or do not speak the language (68 Ideas). Lyons et al. note that relations are hardest across economic and cultural differences: parents are reluctant to approach a big institution, and staff may see them as "uninterested or even hostile." Coletta warns that teachers judge parents at Maslow's esteem level without considering unmet physical, safety and belonging needs, and that "educators draw to themselves that which they believe will occur." For home teaching specifically, parents may believe teaching is the school's job or fear teaching wrongly (Lyons, Ch.5). Fathers face time conflicts and mother- and female-staff "gateways" (Linking Fathers), even though father involvement predicts children's socio-emotional skills (Downer et al., 2008: 25 of 27 studies).</p>
<p><b>Practices ("I would… because…").</b> (1) Build a <b>parent profile</b> (work hours, languages) and a short survey, because "a fixed monthly meeting is not satisfactory" when parents work shifts (Coletta, Ch.4), and programs ignoring needs "suffered" (Lyons). (2) Invite <b>personally</b>, through phone calls, children's invitations and fathers by name, because "simply publicizing is not enough." (3) Begin with <b>school support</b> (a family breakfast; Food, Families, Fun), since it is "a parent's first step toward other forms of involvement." (4) Run <b>home-based instruction</b>: Make-It-Take-It workshops and weekly idea cards that are playful, built on routines and focused on the child's learning, because children whose parents help at home learn more and attend better (Lyons, Ch.5), and this equalizes home environments. (5) Keep <b>two-way communication</b> through a communication notebook and positive phone calls ("one-way isn't communication"). (6) Remove barriers: offer the same session in the evening, childcare, an interpreter. (7) Use <b>active listening and I-messages</b> and act as a helper, an "authority, not authoritarian" who supports rather than supplants parents (Coletta, Ch.2).</p>
<p><b>Conclusion.</b> Family engagement is a total staff effort and a reciprocal partnership; its success depends on what the school changes, not on blaming families.</p>`;

const Q2MODEL = `
<p><b>Intro.</b> Lyons, Robbins & Smith derived the seven vital ingredients from their Study of Parental Involvement; successful districts all followed the same steps. They are "critical to recipes for success" and "important no matter what activity is being developed," so they form the implementation framework for every form of involvement. The first three are the planning stage.</p>
<p><b>1 Coordination.</b> Role: ownership. The coordinator acts as facilitator, provider of information, administrator and trainer. Importance: in the districts where involvement was "most widespread and successful, a major contributing factor was an individual who had direct responsibility"; the coordinator ensures all the other ingredients are met. Without one, follow-up fails.</p>
<p><b>2 Assessing needs & resources.</b> Role: matching what is needed with what is available, formally and informally, for both parents and staff. Importance: where needs were ignored "parental involvement suffered"; where information was gathered first it "tended to thrive." Needs assessment ensures the activity "serves a real purpose," resource assessment ensures enough people. It means planning with families, not for them.</p>
<p><b>3 Specifying & communicating roles.</b> Role: turning intentions into concrete, agreed tasks communicated to parents, staff and administrators. Importance: where roles were assumed, "confusion and conflict arose"; "people are more willing to volunteer if they know exactly what they are getting into." Written roles reduce tension between administrators and parents.</p>
<p><b>4 Recruiting, selecting & assigning.</b> Role: inviting and matching parents to tasks (the coordinator as "matchmaker"). Importance: "simply publicizing opportunities is not enough"; the most effective method is "extensive personal contact." This broadens participation beyond the same few parents, prevents burnout and reaches fathers and working parents.</p>
<p><b>5 Training parents & staff.</b> Role: capacity building, preservice and inservice, for both groups. Importance: "one of the study's most clear-cut findings was that effective, well-planned training lies at the heart of successful parental involvement." It gives parents confidence, prevents teachers doubting aides, and eases staff worries that working with parents is too time-consuming. Intensive training separated successful from unsuccessful advisory groups.</p>
<p><b>6 Communication channels.</b> Role: school↔parents, staff↔parents and parent↔parent flow. Importance: builds rapport and trust; parent exchanges are "an important source for cross-fertilization of ideas"; when parents see their contributions are appreciated "they are more likely to continue."</p>
<p><b>7 Supporting ongoing activities.</b> Role: material support (childcare, transport, parent room, recognition) plus monitoring and evaluation. Importance: removes practical barriers, signals that parents' work "is considered important," and "the more frequent the feedback from monitoring the better; potential problems are not allowed to take root."</p>
<p><b>Conclusion.</b> The ingredients work as a chain: without coordination nobody ensures the rest, and without support even a well-planned activity fades. Every activity I design passes through all seven.</p>`;

const Q3MODEL = `
<p><b>Problem.</b> In Türkiye, preschool enrollment has been low (24% in 2007, compared with a world average of 40%), and children of low-income, low-education mothers, including refugee families, start school less prepared. Kağıtçıbaşı notes that low-SES Turkish mothers often do not help because they believe they "don't know enough." Risk accumulates: Sameroff found that children with no risk factors scored over 30 IQ points higher than those with 8–9. Poverty harms children through mediating family factors such as parental stress (McLoyd), and "even if poverty cannot be arrested, the mediating family problems can be reduced by intervention programs providing support to parents" (Kağıtçıbaşı).</p>
<p><b>Approach.</b> A two-generation program aims "to simultaneously help prepare parents for employment … and to enhance the development of children through direct and indirect supports" (Ramey et al.). Parent-only programs assume a "trickle-down" effect that has little evidence, and child-only programs fade without family support.</p>
<p><b>Program "Growing Together".</b> Low-income neighborhoods; mothers and fathers of 4–5-year-olds; 2 years. <i>Aims:</i> children: school readiness (language, early literacy and numeracy, self-regulation). Parents: responsive, authoritative parenting; confidence as first teachers; literacy and employability; empowerment. Staff: culturally sensitive practice.</p>
<p><i>Core components.</i> (1) Direct ECE for the child in a quality educational preschool, since direct provision beats intermediary means and custodial care is not enough. (2) A TEEP-style cognitive home program (15–20 minutes a day with worksheets and storybooks). (3) Biweekly mother (and father) enrichment groups on development, discipline, communication and health. Groups, not only home visits, because women's groups are culturally appropriate and change attitudes. (4) Adult self-sufficiency: literacy and vocational courses. (5) Family support: health and social referrals, case management, peer networks. It is implemented through the 7 vital ingredients, with local paraprofessional "mother aides," personal recruitment, childcare and transport, and certificates and graduation ceremonies.</p>
<p><b>Conditions for success</b> (Ramey & Ramey's principles): early <b>timing</b>; <b>intensity</b> (in IHDP the highest-participation group gained most; a single set of classes is not enough); <b>breadth</b>; <b>individualization</b>; <b>environmental maintenance</b> into primary school; <b>cultural appropriateness</b>, co-designed with the community. Powell's challenges also apply: match program and parents, avoid a deficit stance, and balance child and parent needs so the child does not get lost.</p>
<p><b>Evidence.</b> TEEP (Kağıtçıbaşı, Sunar & Bekman, 2001): seven years later, 86% of children of trained mothers were still in school compared with 67%; mother training predicted school attainment independently of IQ; mothers used less physical punishment and gained status. Twenty-two years later (2009): 44.1% versus 26.6% college attendance and higher occupational status. MOCEP (AÇEV) scaled it to 60 provinces with a cost-benefit ratio of up to 8:1. Yoshikawa (1994): programs combining ECE with family support are the most effective in the long run.</p>
<p><b>Conclusion.</b> Changing the child's proximal environment through the parent, together with direct child services, produces sustained gains for both generations.</p>`;

/* ============ ENGINE ============ */
const LS="pred416-sprint-v1";
let st={step:0,sub:0,done:{},writes:{},checks:{},cards:{}};
try{const r=localStorage.getItem(LS); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}}

const ALLCARDS=[]; S.forEach(s=>s.blocks.forEach(b=>{if(b.t==="cards"&&!b.all) b.cards.forEach(c=>ALLCARDS.push(c));}));
const TOTAL=S.reduce((a,s)=>a+s.blocks.length,0);
const $=id=>document.getElementById(id);
const main=$("main");
let cardState=null, mcqState=null;

function flatIndex(){let n=0;for(let i=0;i<st.step;i++)n+=S[i].blocks.length;return n+st.sub;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  const s=S[st.step], b=s.blocks[st.sub];
  $("bar").style.width=(100*flatIndex()/(TOTAL-1))+"%";
  let h=`<div class="eyebrow"><span>Adım ${st.step+1} / ${S.length}</span><span>· ~${s.min} dk</span>${s.star?'<span class="star">★ öncelikli</span>':'<span>isteğe bağlı</span>'}</div>
  <h1>${s.title}</h1>
  <div class="subprog">${s.blocks.map((_,i)=>`<span class="${i<st.sub?'done':i===st.sub?'now':''}"></span>`).join("")}</div>
  <div class="card" id="blk"></div>`;
  main.innerHTML=h;
  const el=$("blk");
  if(b.t==="learn") el.innerHTML=`<h2>${b.h}</h2>${b.html}`;
  if(b.t==="cards") renderCards(el,b);
  if(b.t==="mcq") renderMcq(el,b);
  if(b.t==="write") renderWrite(el,b);
  $("prevBtn").disabled = st.step===0&&st.sub===0;
  const last = st.step===S.length-1&&st.sub===s.blocks.length-1;
  $("nextBtn").textContent = last?"Bitti ✓": (st.sub===s.blocks.length-1?"Sonraki adım →":"Devam →");
  window.scrollTo({top:0});
  save();
}

function renderCards(el,b){
  const key=st.step+"-"+st.sub;
  if(!cardState||cardState.key!==key){
    const src=b.all?shuffle(ALLCARDS):b.cards;
    cardState={key,queue:src.map((_,i)=>i),src,flipped:false,known:0,total:src.length};
  }
  const c=cardState;
  if(!c.queue.length){
    el.innerHTML=`<h2>Deste bitti ✓</h2><p>${c.total} kartın hepsini bildin. “Devam”a bas.</p><div class="row"><button class="btn" id="again" type="button">Desteyi tekrarla</button></div>`;
    $("again").onclick=()=>{cardState=null;render();};
    return;
  }
  const card=c.src[c.queue[0]];
  el.innerHTML=`<h2>Flashcard <span class="mini">· ${c.total-c.queue.length}/${c.total} biliniyor · ${c.queue.length} kaldı</span></h2>
  <div class="flash ${c.flipped?'back':''}" id="flash" tabindex="0" role="button" aria-label="Kartı çevir">${c.flipped?`<div>${card[1]}</div>`:`<div><b>${card[0]}</b><span class="hint">Önce kafanda cevapla, sonra dokun (ya da Boşluk)</span></div>`}</div>
  <div class="row">${c.flipped?`<button class="btn bad" id="no" type="button">Tekrar sor</button><button class="btn good" id="yes" type="button">Biliyorum ✓</button>`:`<button class="btn primary" id="flip" type="button">Cevabı göster</button>`}</div>`;
  const flip=()=>{c.flipped=!c.flipped;renderCards(el,b);};
  $("flash").onclick=flip;
  if($("flip"))$("flip").onclick=flip;
  if($("yes"))$("yes").onclick=()=>{c.queue.shift();c.flipped=false;renderCards(el,b);};
  if($("no"))$("no").onclick=()=>{c.queue.push(c.queue.shift());c.flipped=false;renderCards(el,b);};
}

function renderMcq(el,b){
  const key=st.step+"-"+st.sub;
  if(!mcqState||mcqState.key!==key) mcqState={key,i:0,picked:null,score:0};
  const m=mcqState;
  if(m.i>=b.items.length){
    el.innerHTML=`<h2>Quiz bitti</h2><p class="score">${m.score} / ${b.items.length}</p><p>${m.score===b.items.length?"Tam isabet. Devam!":"Yanlışların açıklamalarını bir kez daha düşün, sonra devam et."}</p><div class="row"><button class="btn" id="again" type="button">Tekrar çöz</button></div>`;
    $("again").onclick=()=>{mcqState=null;render();};
    return;
  }
  const it=b.items[m.i];
  el.innerHTML=`<h2>Soru ${m.i+1} / ${b.items.length}</h2><p><b>${it.q}</b></p>
  ${it.o.map((o,j)=>{let cls="";if(m.picked!==null){if(j===it.a)cls="right";else if(j===m.picked)cls="wrong";}return `<button class="opt ${cls}" data-j="${j}" type="button">${o}</button>`;}).join("")}
  ${m.picked!==null?`<div class="note why">${m.picked===it.a?"✓ Doğru. ":"✗ Doğrusu: <b>"+it.o[it.a]+"</b>. "}${it.w}</div><div class="row"><button class="btn primary" id="nq" type="button">Sonraki soru</button></div>`:""}`;
  el.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{if(m.picked!==null)return;m.picked=+btn.dataset.j;if(m.picked===it.a)m.score++;renderMcq(el,b);});
  if($("nq"))$("nq").onclick=()=>{m.i++;m.picked=null;renderMcq(el,b);};
}

function renderWrite(el,b){
  const shown=!!(st.writes[b.id+"_shown"]);
  const checks=st.checks[b.id]||[];
  const got=checks.filter(Boolean).length;
  el.innerHTML=`<h2>Kendi cevabını yaz</h2>
  <p class="note"><b>${b.prompt}</b></p>
  <p class="mini">${b.tip}</p>
  <textarea id="ta" placeholder="İskeletini buraya yaz (ya da kâğıda; kâğıt sınava daha yakın)…">${(st.writes[b.id]||"").replace(/</g,"&lt;")}</textarea>
  <div class="row"><button class="btn ${shown?'':'primary'}" id="show" type="button">${shown?"Model cevabı gizle":"Model cevabı göster"}</button></div>
  ${shown?`<div class="model"><h2>Model cevap</h2>${b.model}
  <h2 style="margin-top:18px">Kendini puanla: cevabında hangileri vardı?</h2>
  <div class="chk">${b.check.map((c,i)=>`<label><input type="checkbox" data-i="${i}" ${checks[i]?"checked":""}><span>${c}</span></label>`).join("")}</div>
  <p class="score" id="sc">${got} / ${b.check.length}</p>
  <p class="mini">Eksik kalan maddeleri bir kez sesli tekrar et ya da kâğıda yaz, sonra devam et.</p></div>`:""}`;
  $("ta").oninput=e=>{st.writes[b.id]=e.target.value;save();};
  $("show").onclick=()=>{st.writes[b.id+"_shown"]=!shown;render();};
  el.querySelectorAll(".chk input").forEach(inp=>inp.onchange=()=>{const a=st.checks[b.id]||[];a[+inp.dataset.i]=inp.checked;st.checks[b.id]=a;save();$("sc").textContent=a.filter(Boolean).length+" / "+b.check.length;});
}

function go(d){
  const s=S[st.step];
  if(d>0){
    if(st.sub<s.blocks.length-1) st.sub++;
    else if(st.step<S.length-1){st.done[st.step]=true;st.step++;st.sub=0;resetTimer();}
    else {st.done[st.step]=true;}
  } else {
    if(st.sub>0) st.sub--;
    else if(st.step>0){st.step--;st.sub=S[st.step].blocks.length-1;resetTimer();}
  }
  render();
}
$("nextBtn").onclick=()=>go(1);
$("prevBtn").onclick=()=>go(-1);

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if(!$("drawer").hidden){if(e.key==="Escape")$("drawer").hidden=true;return;}
  if(e.key==="ArrowRight"){e.preventDefault();go(1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();go(-1);}
  else if(e.key===" "&&$("flash")){e.preventDefault();$("flash").click();}
  else if(cardState&&$("yes")&&(e.key==="1"||e.key==="2")){(e.key==="2"?$("yes"):$("no")).click();}
});

/* drawer */
$("menuBtn").onclick=()=>{
  $("drawerPanel").innerHTML=`<h2>Adımlar</h2><p class="mini">Sırayla gitmen önerilir; buradan sadece geri dönmek için zıpla.</p>`+
   S.map((s,i)=>`<button class="step ${i===st.step?'cur':''}" data-i="${i}" type="button"><span class="n">${i+1}</span><span>${s.title} <span class="mini">· ${s.min} dk</span></span>${st.done[i]?'<span class="done-tick">✓</span>':''}</button>`).join("")+
   `<div class="row"><button class="btn" id="closeD" type="button">Kapat</button><button class="btn bad" id="resetAll" type="button">İlerlemeyi sıfırla</button></div><p class="mini" id="resetMsg"></p>`;
  $("drawer").hidden=false;
  $("drawerPanel").querySelectorAll("button.step").forEach(b=>b.onclick=()=>{st.step=+b.dataset.i;st.sub=0;$("drawer").hidden=true;resetTimer();render();});
  $("closeD").onclick=()=>$("drawer").hidden=true;
  let armed=false;
  $("resetAll").onclick=()=>{if(!armed){armed=true;$("resetMsg").textContent="Emin misin? Tekrar bas.";return;}st={step:0,sub:0,done:{},writes:{},checks:{},cards:{}};save();$("drawer").hidden=true;render();};
};
$("drawer").onclick=e=>{if(e.target.id==="drawer")$("drawer").hidden=true;};

/* timers */
const EXAM=new Date("2026-11-13T17:30:00+03:00").getTime();
let tLeft=null, tRun=false, tInt=null;
function resetTimer(){tRun=false;clearInterval(tInt);tLeft=S[st.step].min*60;$("timerBtn").textContent="Başlat";paintTimer();}
function paintTimer(){
  const m=Math.floor(Math.abs(tLeft)/60), s=Math.abs(tLeft)%60;
  const el=$("stepTimer"); el.textContent=(tLeft<0?"+":"⏱ ")+m+":"+String(s).padStart(2,"0");
  el.classList.toggle("warn",tLeft<=0);
}
$("timerBtn").onclick=()=>{
  if(tRun){tRun=false;clearInterval(tInt);$("timerBtn").textContent="Devam";return;}
  tRun=true;$("timerBtn").textContent="Duraklat";
  tInt=setInterval(()=>{tLeft--;paintTimer();},1000);
};
function examTick(){
  const d=EXAM-Date.now(); const el=$("examLeft");
  if(d<=0){el.textContent="Sınav başladı";return;}
  const h=Math.floor(d/3600000), m=Math.floor(d%3600000/60000);
  el.textContent=`Sınava ${h}s ${m}dk`; el.classList.toggle("warn",d<45*60000);
}
setInterval(examTick,30000); examTick();

if(st.step>=S.length) {st.step=0;st.sub=0;}
if(st.sub>=S[st.step].blocks.length) st.sub=0;
resetTimer();
render();
</script>
